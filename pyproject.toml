[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dispatch-risk-takehome"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.6", "threadpoolctl>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["ipykernel>=6.29", "nbclient>=0.10", "pandas>=2.2", "numpy>=2.0", "scikit-learn>=1.6", "joblib>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

